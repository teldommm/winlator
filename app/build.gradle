import java.net.URL
import java.security.MessageDigest

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Adjust Gradle plugin versions if needed
        classpath 'com.android.tools.build:gradle:8.8.0'
    }

}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// >>> build-time downloads
// The two archives the app ships with (ImageFS and the bundled Proton) are downloaded on the first
// build. Everything below can be overridden with -P<name>=... on the command line, in
// gradle.properties or in ~/.gradle/gradle.properties, e.g. to build from your own mirror:
//   -PimagefsUrlBase=https://host/path/imagefs.tar.zst.   (parts are <base>00, <base>01)
//   -PimagefsSha256=<hex>  -PimagefsSize=<bytes>           (empty sha256 = don't verify)
//   -PprotonUrl=https://host/proton-9.0-arm64ec.tar.zst  -PprotonSha256=<hex>  -PprotonSize=<bytes>
def sourceProp = { String name, String fallback ->
    def value = project.findProperty(name)
    return value != null ? value.toString().trim() : fallback
}

def fileSHA256 = { File file ->
    MessageDigest digest = MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
    }
    digest.digest().collect { String.format("%02x", ((int) it) & 0xff) }.join()
}

def downloadToFile = { String address, File target ->
    new URL(address).withInputStream { input ->
        target.withOutputStream { output -> output << input }
    }
}

tasks.register("downloadImageFS") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File imageFS = new File(assetDir, "imagefs.tar.zst")
    int parts = 2
    // Pinned to a commit (not "main") so a later push to that repository cannot change what we build.
    String urlBase = sourceProp("imagefsUrlBase", "https://raw.githubusercontent.com/Other-backup/winlator-imagefs-v2/6a08be6ea2d142c7739707a1aa5bbe1fac2c4c75/imagefs.tar.zst.")
    String expectedSha = sourceProp("imagefsSha256", "7838756e6a05c91afff68f4bf12aa2780f815877753f8dd354e203e99b9caf8a").toLowerCase()
    long expectedSize = sourceProp("imagefsSize", "193425249") as long

    doLast {
        if (imageFS.exists()) {
            // A file that is already there is used as is (it may be your own ImageFS); only warn.
            if (expectedSha && !fileSHA256(imageFS).equalsIgnoreCase(expectedSha)) {
                logger.warn("imagefs.tar.zst in assets does not match the expected SHA-256; using it anyway.")
            }
            return
        }

        println("ImageFS was not present, downloading...\n")
        // Assemble into a temp file: an interrupted download must not leave a half-written
        // imagefs.tar.zst behind, because the next build would take it for a finished one.
        File tmp = new File(assetDir, "imagefs.tar.zst.download")
        tmp.delete()
        try {
            tmp.withOutputStream { output ->
                for (int i = 0; i < parts; i++) {
                    String suffix = String.format("%02d", i)
                    File partFile = new File(assetDir, "imagefs.tar.zst." + suffix)
                    try {
                        downloadToFile(urlBase + suffix, partFile)
                        partFile.withInputStream { input -> output << input }
                    } finally {
                        partFile.delete()
                    }
                }
            }
            if (expectedSize > 0 && tmp.length() != expectedSize) {
                throw new GradleException("Downloaded ImageFS has the wrong size: expected " + expectedSize + " bytes, got " + tmp.length())
            }
            if (expectedSha && !fileSHA256(tmp).equalsIgnoreCase(expectedSha)) {
                throw new GradleException("Downloaded ImageFS failed SHA-256 validation")
            }
            if (!tmp.renameTo(imageFS)) throw new GradleException("Unable to move the downloaded ImageFS into assets")
        } finally {
            tmp.delete()
        }
    }
}

tasks.register("downloadProton") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File protonARM64EC = new File(assetDir, "proton-9.0-arm64ec.tar.zst")
    File staleProtonARM64EC = new File(assetDir, "proton-10.0-5-arm64ec.tar.zst")
    String protonURL = sourceProp("protonUrl", "https://github.com/Other-backup/winlator-imagefs-v2/releases/download/c/proton-9.0-arm64ec.tar.zst")
    String protonSHA256 = sourceProp("protonSha256", "5f9375640479a5b2c4c3998fda689bb5085febc8fcdb7b6998c79d925392991a")
    long protonSize = sourceProp("protonSize", "73570637") as long

    doLast {
        if (staleProtonARM64EC.exists()) staleProtonARM64EC.delete()

        def isValid = { File file ->
            file.isFile() && (protonSize <= 0 || file.length() == protonSize) &&
                    (!protonSHA256 || fileSHA256(file).equalsIgnoreCase(protonSHA256))
        }
        boolean valid = isValid(protonARM64EC)
        if (!valid) {
            if (protonARM64EC.exists()) protonARM64EC.delete()
            println("Proton 9 ARM64EC was not present or failed validation, downloading...\n")
            File tmp = new File(assetDir, protonARM64EC.name + ".download")
            tmp.delete()
            try {
                downloadToFile(protonURL, tmp)
                if (!isValid(tmp) || !tmp.renameTo(protonARM64EC)) {
                    throw new GradleException("Downloaded Proton 9 ARM64EC archive failed size/SHA-256 validation")
                }
            } finally {
                tmp.delete()
            }
        }
    }
}
// <<< build-time downloads

tasks.register("prepareKotlinBuildScriptModel"){}
downloadProton.dependsOn(downloadImageFS)
preBuild.dependsOn(downloadProton)

android {
    namespace 'com.winlator.cmod'
    // Keep compileSdk from your current config. If you want to match Termux-X11, you could set to 34.
    compileSdk 35
    buildToolsVersion "35.0.0"

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.winlite.bionic"
        minSdkVersion 28
        // We’re preserving Winlator’s request to keep targetSdkVersion at 28
        targetSdkVersion 28

        versionCode 20
        versionName "4.1"

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        // You originally only did arm64-v8a. If you want multi-ABI splits, see below.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api']
    }

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            crunchPngs false
        }
    }

    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // If you want to be sure modern JNI packaging is used:
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            pickFirsts += ["assets/dexopt/baseline.prof", "assets/dexopt/baseline.profm"]
        }
    }

    buildFeatures {
        prefab = true
        compose = true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    // LifecycleStartEffect etc. for screens hosted directly in MainShell. Already on the
    // classpath via compose-ui (api dependency); declared because we use it directly.
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Winlator’s dependencies
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    // Aligned with activity-compose above (Gradle already resolved activity to 1.10.1;
    // the old 1.4.0 pin was stale).
    implementation 'androidx.activity:activity-ktx:1.10.1'
    // The app no longer uses Fragments directly (MainActivity is a single Compose shell), but
    // appcompat pulls fragment in transitively (1.3.6 from appcompat 1.4.0); pinned to 1.8.9 so
    // it stays aligned with activity 1.10 / lifecycle 2.9 instead of the stale transitive one.
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation files('libs/MidiSynth/MidiSynth.jar')
    implementation 'androidx.recyclerview:recyclerview:1.2.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
    implementation 'org.openjsse:openjsse:1.1.7'
    implementation 'androidx.core:core:1.0.1'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-common:2.6.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-native-common:2.6.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    // JVM unit tests (./gradlew testDebugUnitTest). The android.jar used for unit tests has stub
    // org.json classes that throw, so the real implementation is added for the tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
